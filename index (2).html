  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"concept\" style=\"max-width:1320px;margin:0 auto;padding:clamp(46px,6vw,86px) clamp(14px,3vw,22px) 0\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px\">\n      <div>\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:12px\">Le principe<\u002Fdiv>\n        <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(26px,4.2vw,50px);line-height:1.06;text-transform:uppercase;margin:0\">Un conseiller cinéma,<br>pas un catalogue de plus<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(246,238,240,.45);max-width:340px;text-wrap:pretty\">Tu passes trente minutes à chercher quoi regarder. <br>On part de ton moment et on répond en une minute.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:1px;background:rgba(246,238,240,.09);border:1px solid rgba(246,238,240,.09)\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"background:#0d0a0b;padding:28px 24px 32px;transition:background .2s ease\" style-hover=\"background:#1e1218\">\n          <div style=\"font-family:Anton,Impact,sans-serif;font-size:34px;color:rgba(255,45,79,.9);line-height:1;margin-bottom:16px\">{{ s.num }}<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px\">{{ s.titre }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:rgba(246,238,240,.5);text-wrap:pretty\">{{ s.txt }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"categories\" style=\"max-width:1320px;margin:0 auto;padding:clamp(46px,6vw,86px) clamp(14px,3vw,22px) 0\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px\">\n      <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(26px,4.2vw,50px);line-height:1.06;text-transform:uppercase;margin:0\">Le catalogue<br>par catégories<\u002Fh2>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:rgba(246,238,240,.45);max-width:340px;text-wrap:pretty\">Chaque rangée est une requête exacte. <br>Le critère est écrit sous le titre : rien n'est choisi à la main.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:34px\">\n      <sc-if value=\"{{ catalogDown }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:22px;border:1px solid rgba(255,45,79,.34);background:rgba(255,45,79,.07);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between\">\n          <div style=\"font-size:14px;line-height:1.55;color:rgba(246,238,240,.78);max-width:520px\">Le catalogue ne répond pas pour le moment. Vérifie ta connexion — les films reviennent dès que le service est joignable.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ retryCatalog }}\" style=\"padding:12px 20px;background:#ff2d4f;color:#fff;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap\" style-hover=\"background:#ff4f6c\">Réessayer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ shelfSkeletons }}\" as=\"k\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:14px\">\n            <div style=\"font-family:Anton,Impact,sans-serif;font-size:19px;text-transform:uppercase;opacity:.5\">{{ k.label }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;overflow:hidden\">\n            <sc-for list=\"{{ k.cards }}\" as=\"c\" hint-placeholder-count=\"7\"><div style=\"{{ c.style }}\"><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-for list=\"{{ shelves }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px\">\n            <div style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(17px,2.2vw,22px);text-transform:uppercase;letter-spacing:.01em\">{{ s.label }}<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,45,79,.7)\">{{ s.crit }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cm-car\" style=\"position:relative;--cm-ay:clamp(88px,22vw,107px)\">\n          <button class=\"cm-arrow\" sc-camel-on-click=\"{{ s.onPrev }}\" aria-label=\"Films précédents\" style=\"position:absolute;top:var(--cm-ay,50%);left:-6px;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;border:1px solid rgba(246,238,240,.22);background:rgba(7,5,6,.82);backdrop-filter:blur(8px);color:#f6eef0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -10px rgba(0,0,0,.9);transition:background .16s ease,border-color .16s ease,transform .16s ease\" style-hover=\"background:#ff2d4f;border-color:#ff2d4f\">‹<\u002Fbutton>\n          <button class=\"cm-arrow\" sc-camel-on-click=\"{{ s.onNext }}\" aria-label=\"Films suivants\" style=\"position:absolute;top:var(--cm-ay,50%);right:-6px;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;border:1px solid rgba(246,238,240,.22);background:rgba(7,5,6,.82);backdrop-filter:blur(8px);color:#f6eef0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px -10px rgba(0,0,0,.9);transition:background .16s ease,border-color .16s ease,transform .16s ease\" style-hover=\"background:#ff2d4f;border-color:#ff2d4f\">›<\u002Fbutton>\n          <div class=\"cm-row\" data-row=\"{{ s.rowId }}\" style=\"display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;scroll-behavior:smooth\">\n            <sc-for list=\"{{ s.films }}\" as=\"f\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ f.onOpen }}\" style=\"flex:none;width:clamp(118px,32vw,142px);scroll-snap-align:start;text-align:left;transition:transform .2s cubic-bezier(.2,.8,.3,1)\" style-hover=\"transform:translateY(-6px)\">\n                <div style=\"{{ f.posterStyle }}\"><\u002Fdiv>\n                <div style=\"font-size:12.5px;font-weight:600;line-height:1.3;margin-top:9px\">{{ f.titre }}<\u002Fdiv>\n                <div style=\"font-size:11px;letter-spacing:.05em;color:rgba(246,238,240,.4);margin-top:3px\">{{ f.meta }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showPlans }}\" hint-placeholder-val=\"{{ true }}\">\n  <div id=\"abonnement\" style=\"max-width:1320px;margin:0 auto;padding:clamp(46px,6vw,86px) clamp(14px,3vw,22px) 0\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px\">\n      <div>\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:12px\">Abonnement<\u002Fdiv>\n        <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(26px,4.2vw,50px);line-height:1.06;text-transform:uppercase;margin:0\">Trois séances offertes<br>par mois<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:rgba(246,238,240,.45);max-width:340px;text-wrap:pretty\">Au-delà, un seul abonnement, sans palier ni option. {{ freeLimit }} parcours par mois restent gratuits, pour toujours.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:1px;background:rgba(246,238,240,.09);border:1px solid rgba(246,238,240,.09)\">\n      <div style=\"background:#0d0a0b;padding:clamp(26px,3vw,36px)\">\n        <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(246,238,240,.45);margin-bottom:18px\">Découverte<\u002Fdiv>\n        <div style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(34px,4.6vw,52px);line-height:1;text-transform:uppercase;margin-bottom:6px\">Gratuit<\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(246,238,240,.45);margin-bottom:24px\">{{ freeLimit }} parcours par mois<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;font-size:13.5px;line-height:1.5;color:rgba(246,238,240,.6)\">\n          <div>· {{ freeLimit }} séances complètes chaque mois<\u002Fdiv>\n          <div>· Catalogue, recherche et fiches en accès libre<\u002Fdiv>\n          <div>· Aucun compte demandé<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:linear-gradient(150deg,rgba(255,45,79,.14),#0d0a0b 62%);padding:clamp(26px,3vw,36px);position:relative\">\n        <div style=\"position:absolute;top:0;left:0;right:0;height:2px;background:#ff2d4f\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:18px\">\n          <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#ff2d4f\">Illimité<\u002Fdiv>\n          <sc-if value=\"{{ isPro }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#ff2d4f;color:#fff;padding:3px 8px\">Ton offre<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:6px\">\n          <div style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(34px,4.6vw,52px);line-height:1;text-transform:uppercase\">{{ price }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:rgba(246,238,240,.5)\">{{ pricePeriod }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(246,238,240,.45);margin-bottom:24px\">Sans engagement<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:13px;margin-bottom:26px\">\n          <sc-for list=\"{{ perks }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start\">\n              <span style=\"flex:none;width:16px;height:16px;margin-top:2px;background:#ff2d4f;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px\">{{ p.t }}<\u002Fdiv>\n                <div style=\"font-size:12px;line-height:1.5;color:rgba(246,238,240,.5);text-wrap:pretty\">{{ p.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openPricing }}\" style=\"{{ planCtaStyle }}\">{{ planCta }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"max-width:1320px;margin:clamp(52px,7vw,96px) auto 0;padding:0 clamp(14px,3vw,22px)\">\n    <div style=\"border-top:1px solid rgba(246,238,240,.09);padding:26px 0 24px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center\">\n      <div>\n        <div style=\"font-family:Anton,Impact,sans-serif;font-size:19px;text-transform:uppercase;margin-bottom:12px\">Ciné<span style=\"color:#ff2d4f\">Mood<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n          <sc-for list=\"{{ legalLinks }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"font-size:12px;letter-spacing:.04em;color:rgba(246,238,240,.5);text-decoration:underline;text-underline-offset:3px;white-space:nowrap\" style-hover=\"color:#ff2d4f\">{{ l.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;line-height:1.6;color:rgba(246,238,240,.36);max-width:520px;text-wrap:pretty\">Ce produit utilise l'API TMDB mais n'est ni approuvé ni certifié par TMDB. Données et affiches fournies par The Movie Database.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(246,238,240,.06);padding:18px 0 34px;text-align:center;font-size:12.5px;letter-spacing:.04em;color:rgba(246,238,240,.42)\">Site conçu avec le <span style=\"color:#ff2d4f\">♥<\u002Fspan> par un passionné de cinéma<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1320px;margin:0 auto;padding:clamp(24px,3.4vw,44px) clamp(14px,3vw,22px) 80px;animation:cIn .35s both\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px\">\n    <div style=\"max-width:660px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:12px\">Ta séance<\u002Fdiv>\n      <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(30px,5vw,58px);line-height:1.04;text-transform:uppercase;margin:0 0 12px\">Tes films du moment<\u002Fh2>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:rgba(246,238,240,.55)\">{{ resultSub }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ shuffle }}\" style=\"padding:12px 20px;border:1px solid rgba(246,238,240,.24);font-size:13px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">{{ shuffleLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ start }}\" style=\"padding:12px 20px;border:1px solid rgba(246,238,240,.14);font-size:13px;color:rgba(246,238,240,.6);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em\" style-hover=\"border-color:rgba(246,238,240,.45);color:#f6eef0\">Refaire<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasRelax }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ relaxStyle }}\"><span>{{ relaxIcon }}<\u002Fspan><span>{{ relaxNote }}<\u002Fspan><\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px\">\n    <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"6\">\n      <span style=\"font-size:11px;letter-spacing:.05em;padding:6px 11px;border:1px solid rgba(246,238,240,.12);background:rgba(246,238,240,.03);color:rgba(246,238,240,.6)\">{{ c.txt }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:20px;border:1px solid rgba(255,45,79,.4);background:rgba(255,45,79,.09);font-size:14.5px;line-height:1.55\">{{ errorTxt }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:16px\">\n    <sc-for list=\"{{ results }}\" as=\"f\" hint-placeholder-count=\"5\">\n      <div style=\"{{ f.wrapStyle }}\" style-hover=\"border-color:rgba(255,45,79,.55)\">\n        <div class=\"cm-best\" style=\"{{ f.innerStyle }}\">\n          <div class=\"cm-best-poster\" style=\"{{ f.posterWrap }}\"><div style=\"{{ f.posterStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 250px;min-width:0;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div style=\"min-width:0\">\n                <div style=\"{{ f.badgeStyle }}\">{{ f.badge }}<\u002Fdiv>\n                <div style=\"{{ f.titleStyle }}\">{{ f.titre }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;letter-spacing:.05em;color:rgba(246,238,240,.45);margin-top:8px\">{{ f.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;text-align:right\">\n                <div style=\"{{ f.scoreStyle }}\">{{ f.score }}<\u002Fdiv>\n                <div style=\"font-size:9.5px;letter-spacing:.16em;color:rgba(246,238,240,.4)\">{{ f.scoreLabel }}<\u002Fdiv>\n                <sc-if value=\"{{ f.hasDuo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:10.5px;letter-spacing:.05em;color:rgba(246,238,240,.42);margin-top:5px;white-space:nowrap\">{{ f.duoTxt }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:rgba(246,238,240,.55);text-wrap:pretty\">{{ f.resume }}<\u002Fp>\n            <div style=\"padding:12px 14px;border-left:2px solid #ff2d4f;background:rgba(255,45,79,.06)\">\n              <div style=\"font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#ff2d4f;margin-bottom:8px\">Pourquoi lui<\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.5;color:rgba(246,238,240,.75)\">{{ f.why }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ f.criteria }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <div style=\"flex:0 0 62px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(246,238,240,.42)\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"flex:1;height:3px;background:rgba(246,238,240,.09);overflow:hidden\"><div style=\"{{ c.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:0 0 26px;text-align:right;font-size:10.5px;color:rgba(246,238,240,.5)\">{{ c.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px\">\n              <button sc-camel-on-click=\"{{ f.onOpen }}\" style=\"padding:11px 18px;background:#ff2d4f;color:#fff;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap\" style-hover=\"background:#ff4f6c\">Voir la fiche<\u002Fbutton>\n              <a href=\"{{ f.watchUrl }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"padding:11px 16px;border:1px solid rgba(246,238,240,.2);font-size:12.5px;color:rgba(246,238,240,.7);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">Où le voir<\u002Fa>\n              <sc-if value=\"{{ showLists }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ f.onSave }}\" title=\"{{ f.saveTitle }}\" style=\"{{ f.saveStyle }}\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">{{ f.saveLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ showLists }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ f.onSeen }}\" title=\"{{ f.seenTitle }}\" style=\"{{ f.seenStyle }}\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">{{ f.seenLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ f.onSkip }}\" style=\"padding:11px 14px;border:1px solid rgba(246,238,240,.1);font-size:12.5px;color:rgba(246,238,240,.42);text-transform:uppercase;letter-spacing:.04em\" style-hover=\"border-color:rgba(255,45,79,.6);color:#ff8fa1\">Pas lui<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ isFocus }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:55;background:#040303;overflow-y:auto;animation:cIn .26s both\">\n  <div aria-hidden=\"true\" style=\"position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;background:conic-gradient(from 180deg at 50% -10%, transparent 0deg 158deg, rgba(255,236,226,.05) 169deg, rgba(255,236,226,.1) 180deg, rgba(255,236,226,.05) 191deg, transparent 202deg 360deg);animation:cBeam 8s ease-in-out infinite\"><\u002Fdiv>\n  <div aria-hidden=\"true\" style=\"position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(60% 38% at 50% 0%, rgba(255,45,79,.13) 0%, transparent 72%)\"><\u002Fdiv>\n  <div style=\"position:relative;min-height:100%;display:flex;flex-direction:column;max-width:1020px;margin:0 auto;padding:clamp(14px,3vh,30px) clamp(18px,3vw,34px) clamp(24px,5vh,52px)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:clamp(16px,3vh,30px)\">\n      <div style=\"font-family:Anton,Impact,sans-serif;font-size:18px;text-transform:uppercase\">Ciné<span style=\"color:#ff2d4f\">Mood<\u002Fspan><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ quitQuiz }}\" style=\"padding:9px 16px;border:1px solid rgba(246,238,240,.18);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:rgba(246,238,240,.6);white-space:nowrap\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">Quitter ✕<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px\">\n        <button sc-camel-on-click=\"{{ back }}\" style=\"width:36px;height:36px;border:1px solid rgba(246,238,240,.2);display:flex;align-items:center;justify-content:center;flex:none\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">←<\u002Fbutton>\n        <div style=\"flex:1;min-width:130px;display:flex;flex-wrap:wrap;gap:6px\">\n          <sc-for list=\"{{ trail }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <span style=\"{{ t.style }}\">{{ t.txt }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ duoOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;background:rgba(255,45,79,.18);color:#ff8fa1;white-space:nowrap\">Duo · {{ duoWho }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:12px;letter-spacing:.1em;color:#ff2d4f\">{{ stepLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:3px;background:rgba(246,238,240,.08);overflow:hidden;margin-bottom:clamp(24px,4vw,44px)\"><div style=\"{{ barStyle }}\"><\u002Fdiv><\u002Fdiv>\n\n      <div key=\"{{ stepKey }}\" style=\"{{ stepAnim }}\">\n        <div style=\"display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:12px;animation:cIn .45s ease both\"><span style=\"width:20px;height:2px;background:#ff2d4f;display:inline-block;animation:cDash .5s cubic-bezier(.19,1,.22,1) both\"><\u002Fspan>{{ q.kicker }}<\u002Fdiv>\n        <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(27px,4.8vw,52px);line-height:1.08;text-transform:uppercase;margin:0 0 clamp(22px,3.4vw,38px);text-wrap:balance;animation:cRise .5s cubic-bezier(.19,1,.22,1) both\">{{ q.titre }}<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px\">\n          <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" class=\"cm-opt\" style=\"{{ o.style }}\" style-hover=\"border-color:rgba(255,45,79,.7);background:radial-gradient(130% 95% at 50% -12%,rgba(255,236,226,.16),rgba(255,45,79,.08) 42%,rgba(8,6,7,.96) 78%);transform:translateY(-5px);box-shadow:0 0 0 1px rgba(255,45,79,.3),0 28px 52px -26px rgba(255,45,79,.8)\" style-active=\"transform:scale(.97)\">\n              <span class=\"cm-opt-bar\" aria-hidden=\"true\" style=\"position:absolute;left:0;top:0;bottom:0;width:3px;background:#ff2d4f;transform:scaleY(0);transform-origin:top;transition:transform .28s cubic-bezier(.2,.8,.3,1)\"><\u002Fspan>\n              <span aria-hidden=\"true\" style=\"position:absolute;top:10px;right:16px;font-family:Anton,Impact,sans-serif;font-size:60px;line-height:1;color:rgba(246,238,240,.05)\">{{ o.num }}<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:8px;width:100%\">\n                <span style=\"font-size:10px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#ff2d4f\">Ticket N° {{ o.num }}<\u002Fspan>\n                <span aria-hidden=\"true\" style=\"width:5px;height:5px;border-radius:50%;background:#ff2d4f;box-shadow:0 0 8px #ff2d4f\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(23px,2.7vw,30px);line-height:1.04;text-transform:uppercase;letter-spacing:.012em;text-align:left;width:100%;padding-right:34px;text-wrap:balance\">{{ o.label }}<\u002Fspan>\n              <span aria-hidden=\"true\" style=\"position:relative;width:calc(100% + 40px);margin:2px -20px 0;border-top:1px dashed rgba(246,238,240,.16)\">\n                <span style=\"position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#070506;border:1px solid rgba(246,238,240,.1)\"><\u002Fspan>\n                <span style=\"position:absolute;right:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#070506;border:1px solid rgba(246,238,240,.1)\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%\">\n                <span style=\"font-size:13px;line-height:1.45;color:rgba(246,238,240,.58);text-align:left;text-wrap:pretty\">{{ o.sub }}<\u002Fspan>\n                <span class=\"cm-opt-go\" aria-hidden=\"true\" style=\"flex:none;width:32px;height:32px;border-radius:50%;background:#ff2d4f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;opacity:0;transform:translateX(-8px);transition:opacity .2s ease,transform .2s cubic-bezier(.2,.8,.3,1)\">→<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ canSkip }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;justify-content:center;margin-top:20px\">\n            <button sc-camel-on-click=\"{{ skipQ }}\" style=\"display:flex;align-items:center;gap:10px;padding:13px 26px;border:1px dashed rgba(246,238,240,.32);border-radius:999px;font-size:13.5px;font-weight:600;letter-spacing:.03em;color:rgba(246,238,240,.78);transition:all .16s ease\" style-hover=\"border-color:#ff2d4f;border-style:solid;color:#fff;background:rgba(255,45,79,.12)\">{{ skipLabel }}<span style=\"font-size:15px;opacity:.7\">→<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"cm-nav\" style=\"margin-top:18px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,238,240,.28)\">Touches 1–{{ optionCount }} pour répondre · ← pour revenir<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isHandover }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 0\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:18px\">Mode Duo · étape 2<\u002Fdiv>\n      <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(26px,4.6vw,46px);line-height:1.08;text-transform:uppercase;margin:0 0 18px;text-wrap:balance;animation:cUp .4s cubic-bezier(.2,.8,.3,1) both\">Passe l’écran<br>à l’autre personne<\u002Fh2>\n      <p style=\"margin:0 0 30px;font-size:15px;line-height:1.6;color:rgba(246,238,240,.55);max-width:440px;text-wrap:pretty\">Le premier profil est enregistré. À son tour de répondre, sans voir tes réponses — on ne gardera que les films qui tiennent pour vous deux.<\u002Fp>\n      <button sc-camel-on-click=\"{{ startPhaseTwo }}\" style=\"padding:15px 30px;background:#ff2d4f;color:#fff;font-size:14.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase\" style-hover=\"background:#ff4f6c\">C’est à moi<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 0\">\n      <div style=\"width:56px;height:56px;border:2px solid rgba(246,238,240,.14);border-top-color:#ff2d4f;border-radius:50%;animation:cSpin 1s linear infinite;margin-bottom:26px\"><\u002Fdiv>\n      <div key=\"{{ loadingLine }}\" style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(18px,2.6vw,26px);text-transform:uppercase;margin-bottom:16px;animation:cUp .34s cubic-bezier(.2,.8,.3,1) both\">{{ loadingLine }}<\u002Fdiv>\n      <div style=\"position:relative;width:min(260px,66vw);height:2px;background:rgba(246,238,240,.1);overflow:hidden;margin-bottom:18px\">\n        <div style=\"position:absolute;inset:0;width:42%;background-image:linear-gradient(90deg,transparent,#ff2d4f,transparent);animation:cSweep 1.15s ease-in-out infinite\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;line-height:1.7;color:rgba(246,238,240,.35);max-width:520px\">{{ loadingSub }}<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ filmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeFilm }}\" style=\"position:fixed;inset:0;z-index:70;background:rgba(8,4,6,.9);backdrop-filter:blur(10px);display:flex;justify-content:center;overflow-y:auto;padding:clamp(0px,4vh,48px) clamp(0px,2vw,14px);animation:cIn .18s both\">\n  <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:960px;height:max-content;background:#0d0a0b;border:1px solid rgba(246,238,240,.1);overflow:hidden;animation:cUp .34s cubic-bezier(.19,1,.22,1) both\">\n    <sc-if value=\"{{ filmLoading }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:80px 24px;display:flex;justify-content:center\">\n        <div style=\"width:42px;height:42px;border:2px solid rgba(246,238,240,.14);border-top-color:#ff2d4f;border-radius:50%;animation:cSpin 1s linear infinite\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ filmReady }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"{{ film.bannerStyle }}\">\n        <div style=\"position:absolute;inset:0;background-image:linear-gradient(0deg,#0d0a0b 6%,rgba(22,13,17,.35) 70%)\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeFilm }}\" aria-label=\"Fermer la fiche\" style=\"position:absolute;top:14px;right:14px;width:36px;height:36px;background:rgba(8,4,6,.65);border:1px solid rgba(246,238,240,.16);color:#f6eef0\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:0 clamp(16px,3.4vw,34px) clamp(26px,4vw,38px);margin-top:-70px;position:relative\">\n        <div class=\"cm-modal-wrap\" style=\"display:flex;flex-wrap:wrap;gap:22px;margin-bottom:26px\">\n          <div class=\"cm-modal-poster\" style=\"{{ film.posterWrap }}\"><div style=\"{{ film.posterStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"cm-modal-body\" style=\"flex:1 1 280px;min-width:0;padding-top:74px\">\n            <h3 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(24px,3.8vw,40px);line-height:1.1;text-transform:uppercase;margin:0 0 10px;text-wrap:balance\">{{ film.titre }}<\u002Fh3>\n            <div style=\"font-size:12px;letter-spacing:.05em;color:rgba(246,238,240,.48);margin-bottom:16px\">{{ film.meta }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px\">\n              <sc-for list se;color:#ff2d4f;margin-bottom:12px\">Distribution<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;overflow-x:auto;padding-bottom:6px\">\n            <sc-for list=\"{{ film.cast }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div style=\"flex:none;width:106px\">\n                <div style=\"{{ c.photoStyle }}\"><\u002Fdiv>\n                <div style=\"font-size:12.5px;font-weight:600;line-height:1.3;margin-top:8px\">{{ c.nom }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;line-height:1.3;color:rgba(246,238,240,.4);margin-top:2px\">{{ c.role }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ film.noCast }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:rgba(246,238,240,.42)\">Distribution non renseignée.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ legalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeLegal }}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(8,4,6,.92);backdrop-filter:blur(10px);display:flex;justify-content:center;padding:clamp(0px,5vh,60px) clamp(0px,3vw,16px);animation:cIn .18s both\">\n  <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:820px;max-height:100%;display:flex;flex-direction:column;background:#0d0a0b;border:1px solid rgba(246,238,240,.1)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px clamp(16px,3vw,26px);border-bottom:1px solid rgba(246,238,240,.09);flex:none\">\n      <div style=\"display:flex;gap:clamp(12px,2.4vw,24px);overflow-x:auto\">\n        <sc-for list=\"{{ legalTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for ground-image:radial-gradient(66% 44% at 50% 0%, rgba(255,45,79,.22) 0%, transparent 72%)\"><\u002Fdiv>\n  <div style=\"position:relative;width:100%;max-width:620px;text-align:center;animation:cUp .4s cubic-bezier(.19,1,.22,1) both\">\n    <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:16px\">{{ paywallKicker }}<\u002Fdiv>\n    <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(28px,5vw,52px);line-height:1.06;text-transform:uppercase;margin:0 0 16px;text-wrap:balance\">{{ paywallTitle }}<\u002Fh2>\n    <p style=\"margin:0 auto 26px;font-size:15px;line-height:1.6;color:rgba(246,238,240,.6);max-width:460px;text-wrap:pretty\">{{ paywallTxt }}<\u002Fp>\n    <div style=\"border:1px solid rgba(255,45,79,.34);background:linear-gradient(150deg,rgba(255,45,79,.12),rgba(22,13,17,.9) 64%);padding:clamp(22px,3vw,30px);text-align:left;margin-bottom:20px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:18px\">\n        <div style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(30px,4.2vw,44px);line-height:1;text-transform:uppercase\">{{ price }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(246,238,240,.55)\">{{ pricePeriod }} · sans engagement<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:24px\">\n        <sc-for list=\"{{ perks }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;gap:11px;align-items:flex-start\">\n            <span style=\"flex:none;width:18px;height:18px;margin-top:2px;background:#ff2d4f;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n            <div style=\"min-width:0\">\n              <div style=\"font-size:14px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px\">{{ p.t }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.5;color:rgba(246,238,240,.52);text-wrap:pretty\">{{ p.d }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showTerms }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ toggleTerms }}\" style=\"display:flex;align-items:flex-start;gap:11px;text-align:left;margin-bottom:18px;width:100%\">\n          <span style=\"{{ termsBoxStyle }}\">{{ termsMark }}<\u002Fspan>\n          <span style=\"font-size:12.5px;line-height:1.55;color:rgba(246,238,240,.62)\">J’accepte les conditions générales et je demande l’accès immédiat au service, en reconnaissant renoncer à mon droit de rétractation de 14 jours.<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <button sc-camel-on-click=\"{{ subscribe }}\" style=\"{{ subscribeBtnStyle }}\" style-hover=\"background:#ff4f6c\">{{ subscribeCta }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closePaywall }}\" style=\"padding:14px 20px;border:1px solid rgba(246,238,240,.2);font-size:13.5px;color:rgba(246,238,240,.65);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap\" style-hover=\"border-color:rgba(246,238,240,.5);color:#f6eef0\">Plus tard<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;line-height:1.6;color:rgba(246,238,240,.34)\">{{ paywallFine }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ authVisible }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeAuth }}\" style=\"position:fixed;inset:0;z-index:85;background:rgba(8,4,6,.9);backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:clamp(16px,8vh,90px) 16px;animation:cIn .18s both\">\n  <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:440px;background:#0d0a0b;border:1px solid rgba(246,238,240,.1);padding:clamp(22px,3vw,30px);animation:cUp .3s cubic-bezier(.19,1,.22,1) both\">\n    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:6px\">\n      <h3 style=\"font-family:Anton,Impact,sans-serif;font-size:26px;line-height:1.15;text-transform:uppercase;margin:0\">{{ authTitle }}<\u002Fh3>\n      <button sc-camel-on-click=\"{{ closeAuth }}\" aria-label=\"Fermer\" style=\"width:34px;height:34px;border:1px solid rgba(246,238,240,.16);flex:none\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px;font-size:13px;line-height:1.55;color:rgba(246,238,240,.5)\">{{ authSub }}<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:16px\">\n      <input value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmail }}\" type=\"email\" placeholder=\"Adresse e-mail\" style=\"padding:13px 14px;border:1px solid rgba(246,238,240,.16);background:rgba(246,238,240,.04);color:#f6eef0;font-size:14.5px;outline:none\">\n      <input value=\"{{ authPass }}\" sc-camel-on-change=\"{{ onAuthPass }}\" type=\"password\" placeholder=\"Mot de passe (8 car., lettres + chiffres)\" style=\"padding:13px 14px;border:1px solid rgba(246,238,240,.16);background:rgba(246,238,240,.04);color:#f6eef0;font-size:14.5px;outline:none\">\n    <\u002Fdiv>\n    <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-bottom:14px;padding:11px 13px;border:1px solid rgba(255,45,79,.4);background:rgba(255,45,79,.09);font-size:12.5px;line-height:1.5\">{{ authError }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showTurnstile }}\" hint-placeholder-val=\"{{ false }}\">\n      <div ref=\"{{ turnstileRef }}\" style=\"display:flex;justify-content:center;margin-bottom:14px;min-height:65px\"><\u002Fdiv>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ submitAuth }}\" style=\"{{ authCtaStyle }}\" style-hover=\"background:#ff4f6c\">{{ authCta }}<\u002Fbutton>\n    <div style=\"display:flex;flex-direction:column;gap:9px;align-items:center\">\n      <button sc-camel-on-click=\"{{ toggleAuthMode }}\" style=\"font-size:12.5px;color:rgba(246,238,240,.5)\" style-hover=\"color:#ff2d4f\">{{ authSwitch }}<\u002Fbutton>\n      <sc-if value=\"{{ showForgot }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ askForgot }}\" style=\"font-size:12px;color:rgba(246,238,240,.38);text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#ff2d4f\">Mot de passe oublié ?<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid rgba(246,238,240,.08);font-size:11.5px;line-height:1.6;color:rgba(246,238,240,.32)\">{{ authFine }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ activating }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:95;background:rgba(8,4,6,.96);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;animation:cIn .2s both\">\n  <div style=\"width:52px;height:52px;border:2px solid rgba(246,238,240,.14);border-top-color:#ff2d4f;border-radius:50%;animation:cSpin 1s linear infinite;margin-bottom:26px\"><\u002Fdiv>\n  <div style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(22px,4vw,34px);line-height:1.1;text-transform:uppercase;margin-bottom:14px\">Paiement accepté<\u002Fdiv>\n  <div style=\"font-size:14px;line-height:1.6;color:rgba(246,238,240,.55);max-width:380px;text-wrap:pretty\">On active ton accès illimité. Quelques secondes, ne ferme pas la page.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ activated }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ dismissActivated }}\" style=\"position:fixed;inset:0;z-index:95;background:rgba(8,4,6,.94);backdrop-filter:blur(12px);display:flex;justify-content:center;align-items:center;padding:20px;animation:cIn .2s both\">\n  <div sc-camel-o one\">✕<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showAccountId }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"border:1px solid rgba(246,238,240,.1);padding:16px;margin-bottom:16px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px\">\n        <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,238,240,.45)\">Formule<\u002Fdiv>\n        <div style=\"{{ planTagStyle }}\">{{ planTag }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.55;color:rgba(246,238,240,.72)\">{{ planDetail }}<\u002Fdiv>\n      <sc-if value=\"{{ showGauge }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:14px\">\n          <div style=\"display:flex;gap:5px;margin-bottom:8px\">\n            <sc-for list=\"{{ gauge }}\" as=\"g\" hint-placeholder-count=\"3\"><div style=\"{{ g.style }}\"><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:rgba(246,238,240,.4)\">{{ gaugeTxt }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showLists }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px solid rgba(246,238,240,.1);margin-bottom:16px\">\n        <div style=\"display:flex;border-bottom:1px solid rgba(246,238,240,.09)\">\n          <sc-for list=\"{{ accTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"max-height:240px;overflow-y:auto;padding:12px\">\n          <sc-for list=\"{{ accItems }}\" as=\"i\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:11px;align-items:center;padding:8px 4px\">\n              <div style=\"{{ i.artStyle }}\"><\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n texte bascule seul ; on recharge seulement les données TMDB */\n  onLang = () => {\n    var T = this.T, s = this.state, self = this;\n    this.forceUpdate();\n    this.loadShelves();\n    this.state.tabCache = {};\n    this.loadTab(s.tab);\n    if (s.filmId) T.full(s.filmId).then(function (d) { if (self.state.filmId === d.id) self.setState({film: d}); }).catch(function () {});\n    if (s.results && s.results.length) {\n      Promise.all(s.results.map(function (e) { return T.full(e.movie.id).catch(function () { return null; }); })).then(function (ds) {\n        self.setState({results: self.state.results.map(function (e, i) {\n          var d = ds[i]; if (!d || d.id !== e.movie.id) return e;\n          return Object.assign({}, e, {movie: Object.assign({}, e.movie, {title: d.title, overview: d.overview})});\n        })});\n      });\n    }\n    if (s.searchQ && s.searchQ.trim().length > 1) T.search(s.searchQ.trim()).then(function (d) { self.setState({searchResults: (d.results || []).slice(0, 12)}); }).catch(function () {});\n  };\n  componentDidMount() {\n    if (!this.T) return void setTimeout(() => this.componentDidMount(), 250);\n    this.timers.push(setTimeout(() => this.setState({intro: false}), 2100));\n    window.addEventListener('cinemood:lang', this.onLang);\n    if (this.A) {\n      this.A.onChange(() => {\n        var pro = this.A.isPro();\n        /* premier passage en abonné : on félicite une fois, pas à chaque rendu */\n        if (this.state.wasPro === false && pro && !this.A.activationPending() && !this.A.freeMode()) {\n          this.setState({activated: true, paywall: false, wasPro: true});\n        } else this.setState({wasPro: pro});\n      });\n      this.A.boot().then(() => this.setState({wasPro: this.A.isPro()}));\n    }\n    this.loadShelves();\n    this.loadTab(0);\n    this.onKeyDown = (ev) => {\n      var st = this.state;\n      if (ev.key === 'Escape') {\n        if (st.recoveryCode) return this.dismissCode();\n        if (st.recoverOpen) re
