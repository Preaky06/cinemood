    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;scroll-behavior:smooth\">\n            <sc-for list=\"{{ s.films }}\" as=\"f\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ f.onOpen }}\" style=\"flex:none;width:clamp(118px,32vw,142px);scroll-snap-align:start;text-align:left;transition:transform .2s cubic-bezier(.2,.8,.3,1)\" style-hover=\"transform:translateY(-6px)\">\n                <div style=\"{{ f.posterStyle }}\"><\u002Fdiv>\n                <div style=\"font-size:12.5px;font-weight:600;line-height:1.3;margin-top:9px\">{{ f.titre }}<\u002Fdiv>\n                <div style=\"font-size:11px;letter-spacing:.05em;color:rgba(246,238,240,.4);margin-top:3px\">{{ f.meta }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showPlans }}\" hint-placeholder-val=\"{{ true }}\">\n  <div id=\"abonnement\" style=\"max-width:1320px;margin:0 auto;padding:clamp(46px,6vw,86px) clamp(14px,3vw,22px) 0\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px\">\n      <div>\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:12px\">Abonnement<\u002Fdiv>\n        <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(26px,4.2vw,50px);line-height:1.06;text-transform:uppercase;margin:0\">Trois séances offertes<br>par mois<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:rgba(246,238,240,.45);max-width:340px;text-wrap:pretty\">Au-delà, un seul abonnement, sans palier ni option. {{ freeLimit }} parcours par mois restent gratuits, pour toujours.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));ga ,238,240,.5)\">{{ pricePeriod }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(246,238,240,.45);margin-bottom:24px\">Sans engagement<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:13px;margin-bottom:26px\">\n          <sc-for list=\"{{ perks }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start\">\n              <span style=\"flex:none;width:16px;height:16px;margin-top:2px;background:#ff2d4f;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px\">{{ p.t }}<\u002Fdiv>\n                <div style=\"font-size:12px;line-height:1.5;color:rgba(246,238,240,.5);text-wrap:pretty\">{{ p.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openPricing }}\" style=\"{{ planCtaStyle }}\">{{ planCta }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"max-width:1320px;margin:clamp(52px,7vw,96px) auto 0;padding:0 clamp(14px,3vw,22px)\">\n    <div style=\"border-top:1px solid rgba(246,238,240,.09);padding:26px 0 24px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center\">\n      <div>\n        <div style=\"font-family:Anton,Impact,sans-serif;font-size:19px;text-transform:uppercase;margin-bottom:12px\">Ciné<span style=\"color:#ff2d4f\">Mood<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n          <sc-for list=\"{{ legalLinks }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"font-size:12px;letter-spacing:.04em;color:rgba(246,238,240,.5);text-decoration:underline;text-underline-offset:3px olid rgba(246,238,240,.14);font-size:13px;color:rgba(246,238,240,.6);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em\" style-hover=\"border-color:rgba(246,238,240,.45);color:#f6eef0\">Refaire<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasRelax }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ relaxStyle }}\"><span>{{ relaxIcon }}<\u002Fspan><span>{{ relaxNote }}<\u002Fspan><\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px\">\n    <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"6\">\n      <span style=\"font-size:11px;letter-spacing:.05em;padding:6px 11px;border:1px solid rgba(246,238,240,.12);background:rgba(246,238,240,.03);color:rgba(246,238,240,.6)\">{{ c.txt }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:20px;border:1px solid rgba(255,45,79,.4);background:rgba(255,45,79,.09);font-size:14.5px;line-height:1.55\">{{ errorTxt }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:16px\">\n    <sc-for list=\"{{ results }}\" as=\"f\" hint-placeholder-count=\"5\">\n      <div style=\"{{ f.wrapStyle }}\" style-hover=\"border-color:rgba(255,45,79,.55)\">\n        <div class=\"cm-best\" style=\"{{ f.innerStyle }}\">\n          <div class=\"cm-best-poster\" style=\"{{ f.posterWrap }}\"><div style=\"{{ f.posterStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1 1 250px;min-width:0;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div style=\"min-width:0\">\n                <div style=\"{{ f.badgeStyle }}\">{{ f.badge }}<\u002Fdiv>\n                <div style=\"{{ f.titleStyle }}\">{{ f.titre }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;letter-spacing:.05em;color:rgba(246,238,240,.45);margin-top:8px\">{{ f.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;text-align:right\">\n                <div style=\"{{ f.scoreStyle }}\">{{ f.score }}<\u002Fdiv>\n                <div style=\"font-size:9.5px;letter-spacing:.16em;color:rgba(246,238,240,.4)\">{{ f.scoreLabel }}<\u002Fdiv>\n                <sc-if value=\"{{ f.hasDuo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:10.5px;letter-spacing:.05em;color:rgba(246,238,240,.42);margin-top:5px;white-space:nowrap\">{{ f.duoTxt }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:rgba(246,238,240,.55);text-wrap:pretty\">{{ f.resume }}<\u002Fp>\n            <div style=\"padding:12px 14px;border-left:2px solid #ff2d4f;background:rgba(255,45,79,.06)\">\n              <div style=\"font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#ff2d4f;margin-bottom:8px\">Pourquoi lui<\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.5;color:rgba(246,238,240,.75)\">{{ f.why }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ f.criteria }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <div style=\"flex:0 0 62px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(246,238,240,.42)\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"flex:1;height:3px;background:rgba(246,238,240,.09);overflow:hidden\"><div style=\"{{ c.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:0 0 26px;text-align:right;font-size:10.5px;color:rgba(246,238,240,.5)\">{{ c.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px\">\n              <button sc-camel-on-click=\"{{ f.onOpen }}\" style=\"padding:11px 18px;background:#ff2d4f;color:#fff;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap\" style-hover=\"background:#ff4f6c\">Voir la fiche<\u002Fbutton>\n              <a href=\"{{ f.watchUrl }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"padding:11px 16px;border:1px solid rgba(246,238,240,.2);font-size:12.5px;color:rgba(246,238,240,.7);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">Où le voir<\u002Fa>\n              <sc-if value=\"{{ showLists }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ f.onSave }}\" title=\"{{ f.saveTitle }}\" style=\"{{ f.saveStyle }}\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">{{ f.saveLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ showLists }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ f.onSeen }}\" title=\"{{ f.seenTitle }}\" style=\"{{ f.seenStyle }}\" style-hover=\"border-color:#ff2d4f;color:#ff2d4f\">{{ f.seenLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ f.onSkip }}\" style=\"padding:11px 14px;border:1px solid rgba(246,238,240,.1);font-size:12.5px;color:rgba(246,238,240,.42);text-transform:uppercase;letter-spacing:.04em\" style-hover=\"border-color:rgba(255,45,79,.6);color:#ff8fa1\">Pas lui<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ isFocus }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:55;background:#040303;overflow-y:auto;animation:cIn .26s both\"         <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ duoOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;background:rgba(255,45,79,.18);color:#ff8fa1;white-space:nowrap\">Duo · {{ duoWho }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:12px;letter-spacing:.1em;color:#ff2d4f\">{{ stepLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:3px;background:rgba(246,238,240,.08);overflow:hidden;margin-bottom:clamp(24px,4vw,44px)\"><div style=\"{{ barStyle }}\"><\u002Fdiv><\u002Fdiv>\n\n      <div key=\"{{ stepKey }}\" style=\"{{ stepAnim }}\">\n        <div style=\"display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff2d4f;margin-bottom:12px;animation:cIn .45s ease both\"><span style=\"width:20px;height:2px;background:#ff2d4f;display:inline-block;animation:cDash .5s cubic-bezier(.19,1,.22,1) both\"><\u002Fspan>{{ q.kicker }}<\u002Fdiv>\n        <h2 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(27px,4.8vw,52px);line-height:1.08;text-transform:uppercase;margin:0 0 clamp(22px,3.4vw,38px);text-wrap:balance;animation:cRise .5s cubic-bezier(.19,1,.22,1) both\">{{ q.titre }}<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px\">\n          <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" class=\"cm-opt\" style=\"{{ o.style }}\" style-hover=\"border-color:rgba(255,45,79,.7);background:radial-gradient(130% 95% at 50% -12%,rgba(255,236,226,.16),rgba(255,45,79,.08) 42%,rgba(8,6,7,.96) 78%);transform:translateY(-5px);box-shadow:0 0 0 1px rgba(255,45,79,.3),0 28px 52px -26px rgba(255,45,79,.8)\" style-active=\"transform:scale(.97)\">\n              <span class=\"cm-opt-bar\" aria-hidden=\"true\" style=\"pos target=\"_blank\" rel=\"noopener noreferrer\">Ouvrir sur YouTube<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ film.noTrailer }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom:26px;padding:16px;border:1px dashed rgba(246,238,240,.16);font-size:13px;color:rgba(246,238,240,.45)\">Aucune bande-annonce disponible pour ce titre.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div>\n          <div style=\"font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#ff2d4f;margin-bottom:12px\">Distribution<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;overflow-x:auto;padding-bottom:6px\">\n            <sc-for list=\"{{ film.cast }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div style=\"flex:none;width:106px\">\n                <div style=\"{{ c.photoStyle }}\"><\u002Fdiv>\n                <div style=\"font-size:12.5px;font-weight:600;line-height:1.3;margin-top:8px\">{{ c.nom }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;line-height:1.3;color:rgba(246,238,240,.4);margin-top:2px\">{{ c.role }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ film.noCast }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:rgba(246,238,240,.42)\">Distribution non renseignée.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ legalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeLegal }}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(8,4,6,.92);backdrop-filter:blur(10px);display:flex;justify-content:center;padding:clamp(0px,5vh,60px) clamp(0px,3vw,16px);animation:cIn .18s both\">\n  <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:820px;max-height:100%;display:flex;flex-direction:column;background:#0d0a0b;border:1px solid rgba(246,238,240,.1)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px clamp(16px,3vw,26px);border-bottom:1px solid rgba(246,238,240,.09);flex:none\">\n      <div style=\"display:flex;gap:clamp(12px,2.4vw,24px);overflow-x:auto\">\n        <sc-for list=\"{{ legalTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeLegal }}\" aria-label=\"Fermer\" style=\"width:36px;height:36px;border:1px solid rgba(246,238,240,.16);flex:none\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;padding:clamp(20px,3vw,30px)\">\n      <h3 style=\"font-family:Anton,Impact,sans-serif;font-size:clamp(22px,3.4vw,32px);line-height:1.15;text-transform:uppercase;margin:0 0 12px\">{{ legalTitle }}<\u002Fh3>\n      <p style=\"margin:0 0 26px;font-size:13.5px;line-height:1.65;color:rgba(246,238,240,.55);text-wrap:pretty\">{{ legalIntro }}<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <sc-for list=\"{{ legalBlocks }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <div>\n            <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#ff2d4f;margin-bottom:11px\">{{ b.t }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ b.lines }}\" as=\"l\" hint-placeholder-count=\"2\">\n                <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:rgba(246,238,240,.72);text-wrap:pretty\">{{ l.txt }}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:30px;padding-top:18px;border-top:1px solid rgba(246,238,240,.08);font-size:11.5px;line-height:1.6;color:
